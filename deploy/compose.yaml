# Example SIMerald deployment. Adjust as needed and run: docker compose up -d
services:
  simerald:
    image: simerald:local
    build:
      context: ..
    container_name: simerald
    restart: unless-stopped
    ports:
      # Bind to localhost only; expose via reverse proxy or Cloudflare Tunnel
      - '127.0.0.1:25780:25780'
    volumes:
      # Persistent data (owner password hash, Notion token, settings, sync cache).
      # Container runs as UID 1000; ensure host directory is owned by 1000:1000.
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      # Client IP source for login rate-limiting, matching your reverse proxy:
      #   cloudflare: Cloudflare Tunnel / proxy (uses CF-Connecting-IP)
      #   xff:        Nginx / Caddy / etc. (uses last address in X-Forwarded-For)
      #   none:       Direct connection, no proxy (default)
      # Misconfiguration allows header spoofing to bypass lockouts or groups all users under one IP.
      TRUST_PROXY: cloudflare
      # Optional: can also be configured in the admin UI under Notion settings
      # NOTION_TOKEN: ntn_xxx
      # NOTION_CARDS_DB: <cards database ID>
      # NOTION_RECORDS_DB: <records database ID>
      # NOTION_ACCOUNTS_DB: <accounts database ID, optional>
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
